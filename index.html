<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターチューニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --cell: #ffffff;
    --text: #1d1d1f;
    --sub: #6b6b70;
    --line: #c4c4c8;
    --accent: #1d1d1f;
    --hover: #f2f2f4;
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --cell: #191919;
    --text: #ededed;
    --sub: #9a9aa0;
    --line: #4a4a4f;
    --accent: #ededed;
    --hover: #252527;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    height: 100%;
    min-height: 64px;
    padding: 8px;
  }
  .ctrl {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    flex: 0 0 auto;
  }
  .ctrl label {
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: .04em;
  }
  .select-wrap { position: relative; }
  select {
    appearance: none;
    -webkit-appearance: none;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    background: var(--cell);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 7px 34px 7px 12px;
    cursor: pointer;
    min-width: 128px;
  }
  select:hover { background: var(--hover); }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .select-wrap svg {
    position: absolute;
    right: 11px;
    top: 50%;
    width: 12px;
    height: 12px;
    transform: translateY(-50%);
    pointer-events: none;
    stroke: var(--sub);
  }
  .strings {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    border: 2px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    min-width: 0;
  }
  .str {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    padding: 4px 2px;
    background: var(--cell);
    min-width: 0;
  }
  .str + .str { border-left: 2px solid var(--line); }
  .num {
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
  }
  .note {
    font-size: clamp(18px, 34vh, 30px);
    font-weight: 700;
    line-height: 1.05;
    white-space: nowrap;
  }
  .acc {
    font-family: "Noto Sans JP", sans-serif;
    font-size: .72em;
    font-weight: 700;
    margin-left: 1px;
    vertical-align: .18em;
  }
  .detail .acc, .alt .acc { font-size: 1em; vertical-align: 0; margin-left: 0; font-weight: 500; }
  .note .alt {
    font-size: .48em;
    font-weight: 500;
    color: var(--sub);
    margin-left: 3px;
  }
  .detail {
    font-size: 11px;
    font-weight: 500;
    color: var(--sub);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .theme {
    flex: 0 0 auto;
    align-self: center;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: var(--cell);
    border: 2px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .theme:hover { background: var(--hover); }
  .theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme svg { width: 18px; height: 18px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme .moon { display: block; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }

  @media (max-width: 560px) {
    .bar { gap: 6px; padding: 6px; }
    .ctrl label { display: none; }
    select { min-width: 0; font-size: 12px; padding: 6px 26px 6px 8px; }
    .select-wrap svg { right: 8px; }
    .detail { display: none; }
    .note .alt { display: none; }
    .theme { width: 34px; height: 34px; }
    .note { font-size: clamp(14px, 30vh, 22px); }
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="ctrl">
      <label for="tuning">チューニング</label>
      <div class="select-wrap">
        <select id="tuning">
          <option value="0">レギュラー</option>
          <option value="1">半音下げ</option>
          <option value="2">1音下げ</option>
          <option value="3">1音半下げ</option>
          <option value="4">2音下げ</option>
          <option value="5">2音半下げ</option>
        </select>
        <svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>
      </div>
    </div>

    <div class="strings" id="strings"></div>

    <button class="theme" id="theme" type="button" aria-label="表示モード切替" title="ライト / ダーク切替">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

<script>
  // 6弦→1弦（MIDIノート番号）
  var STANDARD = [
    { n: 6, midi: 40 }, // E2
    { n: 5, midi: 45 }, // A2
    { n: 4, midi: 50 }, // D3
    { n: 3, midi: 55 }, // G3
    { n: 2, midi: 59 }, // B3
    { n: 1, midi: 64 }  // E4
  ];
  var SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  var FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  // 一般的な呼び方に合わせた表記（半音下げ＝E♭、1音半下げ＝C♯ など）
  var USE_FLAT = { 0: false, 1: true, 2: false, 3: false, 4: true, 5: false };

  var sel = document.getElementById("tuning");
  var box = document.getElementById("strings");
  var root = document.documentElement;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function fmt(name) {
    return name.length > 1 ? name[0] + '<span class="acc">' + name.slice(1) + '</span>' : name;
  }

  function render() {
    var down = parseInt(sel.value, 10);
    var flat = USE_FLAT[down];
    var html = "";
    STANDARD.forEach(function (s) {
      var m = s.midi - down;
      var pc = m % 12;
      var oct = Math.floor(m / 12) - 1;
      var main = fmt((flat ? FLAT : SHARP)[pc]);
      var other = fmt((flat ? SHARP : FLAT)[pc]);
      var alt = main !== other ? '<span class="alt">' + other + '</span>' : "";
      var hz = 440 * Math.pow(2, (m - 69) / 12);
      html += '<div class="str">' +
        '<span class="num">' + s.n + '弦</span>' +
        '<span class="note">' + main + alt + '</span>' +
        '<span class="detail">' + main + oct + ' · ' + hz.toFixed(1) + 'Hz</span>' +
        '</div>';
    });
    box.innerHTML = html;
  }

  function setTheme(t) {
    if (t === "dark") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
  }

  var params = new URLSearchParams(location.search);
  setTheme(params.get("theme") || load("gtw-theme") || "light");
  var saved = params.get("tuning") || load("gtw-tuning");
  if (saved !== null && sel.querySelector('option[value="' + saved + '"]')) sel.value = saved;

  sel.addEventListener("change", function () { store("gtw-tuning", sel.value); render(); });
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(next);
    store("gtw-theme", next);
  });

  render();
</script>
</body>
</html>
