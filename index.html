<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターチューニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --head: #ffffff;
    --tx: #1d1d1f;
    --sub: #77736a;
    --line: #d9d2c2;
    --hover: #f3efe6;
    --wood: #ecd7ad;
    --grain: rgba(150, 105, 50, .10);
    --fret: #a9a9a9;
    --nut: #f7f2e4;
    --nutline: #d8cfb6;
    --str: #7d7d7d;
    --wound: #a88552;
    --dot: #d2b98c;
    --badge: #1d1d1f;
    --badgetx: #ffffff;
  }
  :root[data-theme="dark"] {
    --head: #17130f;
    --tx: #f1ece2;
    --sub: #a39b8c;
    --line: #3a2f26;
    --hover: #261f19;
    --wood: #3b2519;
    --grain: rgba(0, 0, 0, .22);
    --fret: #8d8d8d;
    --nut: #e9e1cd;
    --nutline: #bfb49a;
    --str: #bdbdbd;
    --wound: #c9a46c;
    --dot: #d8cfbd;
    --badge: #f1ece2;
    --badgetx: #1d1d1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--head);
    color: var(--tx);
    font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .wrap {
    position: relative;
    display: flex;
    height: 100%;
    min-height: 120px;
    border: 2px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--head);
  }

  /* 左：チューニング選択 */
  .head {
    flex: 0 0 168px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 0 10px 0 16px;
  }
  .head .t {
    font-size: 10px;
    font-weight: 800;
    color: var(--sub);
    letter-spacing: .14em;
    padding-left: 6px;
  }
  .sel { position: relative; }
  select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--tx);
    background: transparent;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 4px 28px 4px 6px;
    cursor: pointer;
  }
  select:hover { background: var(--hover); }
  select:focus-visible { outline: none; border-color: var(--sub); }
  select option { color: #1d1d1f; background: #ffffff; }
  .sel svg {
    position: absolute;
    right: 8px;
    top: 50%;
    width: 12px;
    height: 12px;
    transform: translateY(-50%);
    pointer-events: none;
    stroke: var(--tx);
  }

  /* 弦番号＋音名 */
  .labels {
    flex: 0 0 92px;
    position: relative;
  }
  .lab {
    position: absolute;
    right: 10px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lab .n {
    font-family: "Noto Sans JP", sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--sub);
  }
  .lab .b {
    min-width: 40px;
    height: calc(var(--row) * .82);
    max-height: 26px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--badge);
    color: var(--badgetx);
    font-size: clamp(11px, calc(var(--row) * .55), 15px);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  .acc {
    font-family: "Noto Sans JP", sans-serif;
    font-size: .78em;
    margin-left: 1px;
  }

  /* ナット */
  .nut {
    flex: 0 0 12px;
    background: var(--nut);
    border-left: 2px solid var(--nutline);
    border-right: 2px solid var(--nutline);
    position: relative;
    z-index: 2;
  }

  /* 指板 */
  .board {
    flex: 1 1 auto;
    position: relative;
    min-width: 0;
    background:
      repeating-linear-gradient(0deg, var(--grain) 0 2px, transparent 2px 7px),
      var(--wood);
  }
  .fret {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    margin-left: -2px;
    background: var(--fret);
  }
  .inlay {
    position: absolute;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--dot);
  }
  .string {
    position: absolute;
    left: -16px;
    right: 0;
    transform: translateY(-50%);
    z-index: 3;
  }

  /* 表示モード切替（マウスを乗せたときだけ出す） */
  .theme {
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 5;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: var(--head);
    color: var(--tx);
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
  }
  .wrap:hover .theme, .theme:focus-visible { opacity: .85; }
  .theme:hover { opacity: 1 !important; }
  @media (hover: none) { .theme { opacity: .45; } }
  .theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }

  @media (max-width: 560px) {
    .head { flex-basis: 104px; padding: 0 4px 0 8px; }
    .head .t { display: none; }
    select { font-size: 14px; padding: 4px 22px 4px 4px; }
    .sel svg { right: 4px; }
    .labels { flex-basis: 70px; }
    .lab { right: 6px; gap: 5px; }
    .lab .b { min-width: 32px; padding: 0 6px; }
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="head">
      <span class="t">TUNING</span>
      <div class="sel">
        <select id="tuning" aria-label="チューニング">
          <option value="0">レギュラー</option>
          <option value="1">半音下げ</option>
          <option value="2">1音下げ</option>
          <option value="3">1音半下げ</option>
          <option value="4">2音下げ</option>
          <option value="5">2音半下げ</option>
        </select>
        <svg viewBox="0 0 12 12" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>
      </div>
    </div>
    <div class="labels" id="labels"></div>
    <div class="nut"></div>
    <div class="board" id="board"></div>

    <button class="theme" id="theme" type="button" aria-label="ライト / ダーク切替" title="ライト / ダーク切替">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

<script>
  // 1弦（上）→6弦（下）。m=MIDIノート番号、g=弦ゲージ
  var STRINGS = [
    { n: 1, m: 64, g: .010 },
    { n: 2, m: 59, g: .013 },
    { n: 3, m: 55, g: .017 },
    { n: 4, m: 50, g: .026 },
    { n: 5, m: 45, g: .036 },
    { n: 6, m: 40, g: .046 }
  ];
  var SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  var FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  // 一般的な呼び方に合わせる（半音下げ＝E♭、1音半下げ＝C♯、2音下げ＝C F B♭ E♭ G C）
  var USE_FLAT = { 0: false, 1: true, 2: false, 3: false, 4: true, 5: false };

  var sel = document.getElementById("tuning");
  var labels = document.getElementById("labels");
  var board = document.getElementById("board");
  var wrap = document.getElementById("wrap");
  var root = document.documentElement;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function rowY(i) { return (i + 0.5) / 6 * 100; }

  function name(midi, flat) {
    var s = (flat ? FLAT : SHARP)[midi % 12];
    return s.length > 1 ? s[0] + '<span class="acc">' + s.slice(1) + '</span>' : s;
  }

  // 指板（フレット間隔は実物の比率）
  function drawBoard() {
    var LAST = 9.6, total = 1 - Math.pow(2, -LAST / 12);
    function x(f) { return (1 - Math.pow(2, -f / 12)) / total * 100; }
    var h = "";
    for (var f = 1; f <= 9; f++) h += '<div class="fret" style="left:' + x(f) + '%"></div>';
    [3, 5, 7, 9].forEach(function (f) {
      h += '<div class="inlay" style="left:' + (x(f - 1) + x(f)) / 2 + '%;top:50%"></div>';
    });
    STRINGS.forEach(function (s, i) {
      var w = (1.2 + s.g * 70).toFixed(2);
      h += '<div class="string" style="top:' + rowY(i) + '%;height:' + w + 'px;background:' +
        (s.n >= 4 ? "var(--wound)" : "var(--str)") + '"></div>';
    });
    board.innerHTML = h;
  }

  function render() {
    var down = parseInt(sel.value, 10);
    var flat = USE_FLAT[down];
    var h = "";
    STRINGS.forEach(function (s, i) {
      h += '<div class="lab" style="top:' + rowY(i) + '%"><span class="n">' + s.n + '弦</span>' +
        '<span class="b">' + name(s.m - down, flat) + '</span></div>';
    });
    labels.innerHTML = h;
  }

  function sizeRows() { wrap.style.setProperty("--row", (wrap.clientHeight / 6) + "px"); }

  function setTheme(t) {
    if (t === "dark") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
  }

  var params = new URLSearchParams(location.search);
  setTheme(params.get("theme") || load("gtw-theme") || "light");
  var saved = params.get("tuning") || load("gtw-tuning");
  if (saved !== null && sel.querySelector('option[value="' + saved + '"]')) sel.value = saved;

  sel.addEventListener("change", function () { store("gtw-tuning", sel.value); render(); });
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(next);
    store("gtw-theme", next);
  });
  window.addEventListener("resize", sizeRows);

  sizeRows();
  drawBoard();
  render();
</script>
</body>
</html>
